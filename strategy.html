<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategy — Agbota Segun</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5cff'/%3E%3Ctext x='50' y='68' font-size='48' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EAS%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="site-nav"></div>
<main id="detail" class="section-tight" style="padding-top:44px">
  <div class="container"><div class="loading-box"><div class="spinner"></div></div></div>
</main>
<div id="site-footer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(function () {
  const slug = decodeURIComponent(window.location.pathname.split('/').pop());

  function render(p, reviews) {
    const badgeText = p.tier === 'single' ? 'Single Platform' : p.tier === 'combo' ? 'Combined Strategy' : 'Custom Strategy';
    document.title = p.name + ' — Agbota Segun';

    document.getElementById('detail').innerHTML = `
      <div class="container">
        <a href="/strategies" style="display:inline-flex;align-items:center;gap:7px;color:var(--text-3);font-size:.9rem;margin-bottom:22px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          All strategies
        </a>

        <div class="grid" style="grid-template-columns:1.45fr .95fr;gap:40px;align-items:start">
          <div>
            <span class="eyebrow">${badgeText}</span>
            <h1 style="font-size:clamp(1.9rem,4vw,2.9rem)">${AS.escapeHtml(p.name)}</h1>
            <p class="lead">${AS.escapeHtml(p.tagline || '')}</p>

            <div class="platform-tags" style="margin:20px 0 26px">
              ${(p.platforms || []).map((pl) => {
                const s = AS.platformStyle(pl);
                return `<span class="tag" style="background:${s.bg};color:${s.color};border-color:transparent">${AS.escapeHtml(pl)}</span>`;
              }).join('')}
            </div>

            <div class="card" style="margin-bottom:22px">
              <h3>About this strategy</h3>
              <p style="margin:0;white-space:pre-line">${AS.escapeHtml(p.description)}</p>
            </div>

            <div class="card" style="margin-bottom:22px">
              <h3>What is included</h3>
              <ul class="feature-list" style="margin:0">
                ${(p.includes || []).map((i) => `<li>${AS.escapeHtml(i)}</li>`).join('')}
              </ul>
            </div>

            ${p.audience ? `
            <div class="card" style="margin-bottom:22px">
              <h3>Who this is for</h3>
              <p style="margin:0">${AS.escapeHtml(p.audience)}</p>
            </div>` : ''}

            ${reviews && reviews.length ? `
            <div class="card">
              <h3>Reviews for this strategy</h3>
              <div class="grid" style="gap:14px">
                ${reviews.map((r) => `
                  <div style="border-bottom:1px solid var(--line);padding-bottom:13px">
                    <div class="stars" style="margin-bottom:6px">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                    ${r.body ? `<p style="font-size:.92rem;margin-bottom:6px">${AS.escapeHtml(r.body)}</p>` : ''}
                    <small style="color:var(--text-3)">${AS.escapeHtml(r.reviewerName)} · ${AS.formatDate(r.createdAt)}</small>
                  </div>`).join('')}
              </div>
            </div>` : ''}
          </div>

          <aside style="position:sticky;top:96px">
            <div class="card" style="border-color:var(--line-strong)">
              <div class="price-row">
                <span class="price">${AS.money(p.price)}</span>
                ${p.tier === 'custom' ? '<span class="price-note">starting from</span>' : ''}
              </div>
              ${p.priceNote ? `<p class="hint" style="margin:-8px 0 16px">${AS.escapeHtml(p.priceNote)}</p>` : ''}
              <a href="/checkout/${encodeURIComponent(p.slug)}" class="btn btn-primary btn-block btn-lg" style="margin-bottom:11px">
                ${p.tier === 'custom' ? 'Request this strategy' : 'Purchase strategy'}
              </a>
              <a href="/chat" class="btn btn-ghost btn-block">Ask a question in Chat</a>

              <div style="border-top:1px solid var(--line);margin-top:19px;padding-top:17px">
                <div style="display:flex;gap:10px;margin-bottom:11px;font-size:.88rem;color:var(--text-2)">
                  <span>💳</span><span>Pay with Bitcoin or PayPal</span>
                </div>
                <div style="display:flex;gap:10px;margin-bottom:11px;font-size:.88rem;color:var(--text-2)">
                  <span>💬</span><span>Direct chat with Agbota Segun</span>
                </div>
                <div style="display:flex;gap:10px;font-size:.88rem;color:var(--text-2)">
                  <span>📄</span><span>Written blueprint you keep</span>
                </div>
              </div>
              ${p.tier === 'custom' ? `
              <div class="alert alert-info show" style="margin:17px 0 0;font-size:.85rem">
                The final price for custom work depends on scope. Scope and price are agreed with you in Chat before you pay anything.
              </div>` : ''}
            </div>
          </aside>
        </div>
      </div>`;

    // Stack the sidebar on smaller screens.
    const grid = document.querySelector('#detail .grid');
    const apply = () => {
      if (window.innerWidth < 940) {
        grid.style.gridTemplateColumns = '1fr';
        const aside = grid.querySelector('aside');
        if (aside) aside.style.position = 'static';
      } else {
        grid.style.gridTemplateColumns = '1.45fr .95fr';
        const aside = grid.querySelector('aside');
        if (aside) aside.style.position = 'sticky';
      }
    };
    apply();
    window.addEventListener('resize', apply);
  }

  document.addEventListener('DOMContentLoaded', () => {
    AS.boot({ after: async () => {
      try {
        const data = await AS.api('/api/products/' + encodeURIComponent(slug));
        render(data.product, data.reviews);
      } catch (e) {
        document.getElementById('detail').innerHTML = `
          <div class="container"><div class="empty">
            <div class="empty-icon">🔍</div><h3>Strategy not found</h3>
            <p>This strategy does not exist or is no longer available.</p>
            <a href="/strategies" class="btn btn-primary" style="margin-top:16px">View all strategies</a>
          </div></div>`;
      }
    }});
  });
})();
</script>
</body>
</html>
