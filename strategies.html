<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategies — Agbota Segun</title>
<meta name="description" content="Creator and streamer growth strategy blueprints for YouTube, Twitch, TikTok, Facebook, Instagram and Discord.">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5cff'/%3E%3Ctext x='50' y='68' font-size='48' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EAS%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="site-nav"></div>

<section class="section-tight" style="padding-top:52px">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Strategy Blueprints</span>
      <h1 style="font-size:clamp(2rem,4.4vw,3.1rem)">Creator &amp; Streamer Growth Strategies</h1>
      <p class="lead">Choose a single platform strategy, a combined multi-platform growth system, or request fully custom work.</p>
    </div>

    <div class="filter-bar" id="tier-filter">
      <button class="filter-btn active" data-tier="all">All Strategies</button>
      <button class="filter-btn" data-tier="single">Single Platform</button>
      <button class="filter-btn" data-tier="combo">Combined</button>
      <button class="filter-btn" data-tier="custom">Custom</button>
    </div>

    <div id="catalog"><div class="loading-box"><div class="spinner"></div></div></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(function () {
  let ALL = [];

  function card(p) {
    const badge = p.tier === 'single' ? 'badge-single' : p.tier === 'combo' ? 'badge-combo' : 'badge-custom';
    const badgeText = p.tier === 'single' ? 'Single' : p.tier === 'combo' ? 'Combined' : 'Custom';
    return `
      <article class="product-card">
        <span class="product-badge ${badge}">${badgeText}</span>
        <h3>${AS.escapeHtml(p.name)}</h3>
        <p class="product-tagline">${AS.escapeHtml(p.tagline || '')}</p>
        <div class="price-row">
          <span class="price">${AS.money(p.price)}</span>
          ${p.tier === 'custom' ? '<span class="price-note">starting from</span>' : ''}
        </div>
        ${p.priceNote ? `<p class="hint" style="margin:-10px 0 14px">${AS.escapeHtml(p.priceNote)}</p>` : ''}
        <div class="platform-tags">
          ${(p.platforms || []).map((pl) => `<span class="tag">${AS.escapeHtml(pl)}</span>`).join('')}
        </div>
        <ul class="feature-list">
          ${(p.includes || []).slice(0, 4).map((i) => `<li>${AS.escapeHtml(i)}</li>`).join('')}
        </ul>
        <a href="/strategy/${encodeURIComponent(p.slug)}" class="btn btn-primary btn-block">View strategy</a>
      </article>`;
  }

  function render(tier) {
    const groups = [
      { key: 'single', title: 'Single Platform Strategies', sub: 'One platform, fully documented — $30 each.', id: 'single' },
      { key: 'combo', title: 'Combined Strategies', sub: 'Multiple platforms connected into one growth system.', id: 'combo' },
      { key: 'custom', title: 'Custom Strategy', sub: 'Scoped and priced with you before any payment.', id: 'custom' },
    ].filter((g) => tier === 'all' || g.key === tier);

    const html = groups.map((g) => {
      const items = ALL.filter((p) => p.tier === g.key);
      if (!items.length) return '';
      return `
        <div id="${g.id}" style="margin-bottom:52px;scroll-margin-top:100px">
          <div style="margin-bottom:22px">
            <h2 style="font-size:1.6rem;margin-bottom:5px">${g.title}</h2>
            <p style="margin:0;color:var(--text-3)">${g.sub}</p>
          </div>
          <div class="grid grid-3">${items.map(card).join('')}</div>
        </div>`;
    }).join('');

    document.getElementById('catalog').innerHTML = html || '<div class="empty"><p>No strategies found.</p></div>';
  }

  document.addEventListener('DOMContentLoaded', () => {
    AS.boot({ after: async () => {
      try {
        const data = await AS.api('/api/products');
        ALL = data.products;
        render('all');
        if (location.hash) {
          const el = document.querySelector(location.hash);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
      } catch (e) {
        document.getElementById('catalog').innerHTML = '<div class="empty"><p>Could not load strategies. Please refresh the page.</p></div>';
      }
    }});

    document.getElementById('tier-filter').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('#tier-filter .filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.tier);
    });
  });
})();
</script>
</body>
</html>
